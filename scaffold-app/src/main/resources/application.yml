server:
  port: 8090

spring:
  application:
    name: scaffold-app

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 文件上传
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://129.211.62.23:5432/scaffold_db
    username: scaffold_user
    password: Scaffold@2026
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Redis 配置
  data:
    redis:
      host: 129.211.62.23
      port: 6379
      password: leezw123+.
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 邮件通知（证书到期/续期通知用，未配置则自动跳过邮件渠道）
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 认证配置
scaffold:
  auth:
    jwt:
      secret: scaffold-project-jwt-secret-key-2026-very-long-secret
      expire: 7200
    session:
      enabled: false
      timeout: 86400
      single-login: false
    exclude-paths:
      - /api/auth/login
      - /api/auth/pre-login
      - /doc.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /favicon.ico
      - /error

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用配置
app:
  # 文件上传
  upload:
    path: /data/upload
    max-size: 20
    storage-type: local
    oss:
      endpoint:
      bucket:
      access-key:
      secret-key:
  # 代码生成
  gen:
    project-path: /root/.openclaw/workspace/scaffold-project
    front-path: /root/.openclaw/workspace/scaffold-project/admin-front-new
  # 日志开关
  log:
    operation:
      enabled: true       # 操作日志总开关
      save-response: false # 是否保存响应数据
    login:
      enabled: true        # 登录日志开关

# 证书自动化模块配置
cert:
  crypto:
    # AES 主密钥（>=32位），强烈建议通过环境变量 CERT_CRYPTO_SECRET 注入
    secret: ${CERT_CRYPTO_SECRET:scaffold-cert-please-change-this-secret-key}
  acme:
    letsencrypt-directory: https://acme-v02.api.letsencrypt.org/directory
    letsencrypt-staging-directory: https://acme-staging-v02.api.letsencrypt.org/directory
    zerossl-directory: https://acme.zerossl.com/v2/DV90
    dns-propagation-seconds: 30      # DNS TXT 写入后等待传播秒数
    challenge-timeout-seconds: 180   # 验证/finalize 轮询超时
  renew:
    enabled: true
    cron: "0 0 3 * * ?"              # 每日 03:00 扫描续期
    renew-before-days: 30            # 到期前 30 天续期
    expiry-warn-days: 15             # 到期前 15 天预警
  storage:
    export-path: /data/certs         # 可选：证书导出目录
  notify:
    email:
      enabled: false
      to: lizhouwei@mokahr.io
    webhook:
      enabled: false
      type: dingtalk                 # dingtalk / wecom
      url: ""
